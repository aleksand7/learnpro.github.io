<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - LearnPro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Специальные стили только для этой страницы */
        .auth-section {
            padding: 140px 0 80px;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .auth-card {
            background: white;
            border-radius: 32px;
            padding: 3rem;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .auth-card h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-card p {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        .form-group small {
            color: #64748b;
            display: block;
            margin-top: 0.3rem;
            font-size: 0.8rem;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .status-success {
            background: #ecfdf5;
            color: #059669;
        }
        
        .status-error {
            background: #fef2f2;
            color: #dc2626;
        }
        
        .status-loading {
            background: #f0f9ff;
            color: #8b5cf6;
        }
        
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
        }
        
        .auth-footer a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        #emailDisplay {
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-warning {
    background: #fffbeb;
    color: #b45309;
    border-left: 4px solid #f59e0b;
}
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="logo">
                <h2 onclick="window.location.href='index.html'" style="cursor: pointer;">LearnPro</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">🏠 Главная</a></li>
                <li><a href="#" onclick="showLoginModal()">🔐 Войти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h1>🔐 Восстановление пароля</h1>
                
                <!-- Форма запроса сброса -->
                <div id="requestResetSection">
                    <p>Введите email, указанный при регистрации</p>
                    
                    <form id="forgotPasswordForm">
                        <div class="form-group">
                            <input 
                                type="email" 
                                id="resetEmail" 
                                placeholder="your@email.com" 
                                required
                                autocomplete="off"
                            >
                        </div>
                        <button type="submit" class="submit-btn">
                            Отправить инструкции
                        </button>
                    </form>
                    
                    <div id="resetStatus" class="status-message"></div>
                    
                    <div class="auth-footer">
                        <p>
                            Вспомнили пароль? 
                            <a href="#" onclick="showLoginModal(); return false;">Войти</a>
                        </p>
                    </div>
                </div>

                <!-- Форма установки нового пароля -->
                <div id="setNewPasswordSection" style="display: none;">
                    <p>Придумайте новый пароль</p>
                    
                    <form id="resetPasswordForm">
                        <input type="hidden" id="resetToken">
                        
                        <div class="form-group">
                            <input 
                                type="password" 
                                id="newPassword" 
                                placeholder="Новый пароль" 
                                required 
                                minlength="6"
                                autocomplete="new-password"
                            >
                            <small>Минимум 6 символов</small>
                        </div>
                        
                        <div class="form-group">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                placeholder="Повторите пароль" 
                                required
                                autocomplete="new-password"
                            >
                        </div>
                        
                        <button type="submit" class="submit-btn">
                            Установить новый пароль
                        </button>
                    </form>
                    
                    <div id="newPasswordStatus" class="status-message"></div>
                    
                    <div class="auth-footer">
                        <p>
                            <a href="#" onclick="showRequestForm(); return false;">
                                ← Запросить новую ссылку
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Login Modal (нужно для ссылки "Войти") -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">&times;</span>
            <h2>Вход в кабинет</h2>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>
            
            <div id="loginStatus" class="status-message"></div>
            
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="#" onclick="showRegisterModal(); closeLoginModal()">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegisterModal()">&times;</span>
            <h2>Регистрация</h2>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <input type="text" id="firstName" placeholder="Имя" required>
                </div>
                <div class="form-group">
                    <input type="text" id="lastName" placeholder="Фамилия" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <button type="submit" class="submit-btn">Создать аккаунт</button>
            </form>
            
            <div id="registerStatus" class="status-message"></div>
            
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="#" onclick="showLoginModal(); closeRegisterModal()">Войти</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="reset-password.js"></script>
    
    <script>
        // Функция для возврата к форме запроса
        function showRequestForm() {
            document.getElementById('setNewPasswordSection').style.display = 'none';
            document.getElementById('requestResetSection').style.display = 'block';
            document.getElementById('resetStatus').innerHTML = '';
            document.getElementById('newPasswordStatus').innerHTML = '';
        }
        
        // Функции для модальных окон (на случай если их нет в script.js)
        function showLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.style.display = 'block';
        }
        
        function closeLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.style.display = 'none';
        }
        
        function showRegisterModal() {
            const modal = document.getElementById('registerModal');
            if (modal) modal.style.display = 'block';
        }
        
        function closeRegisterModal() {
            const modal = document.getElementById('registerModal');
            if (modal) modal.style.display = 'none';
        }
        
        // Закрытие модальных окон по клику вне
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
