<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack-разработка - LearnPro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .course-view {
            padding: 120px 0 60px;
            background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
            min-height: 100vh;
            margin-top: 70px;
        }

        .course-header {
            background: var(--gradient);
            color: white;
            padding: 3rem;
            border-radius: 32px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .course-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
        }

        .course-header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .course-header-icon {
            font-size: 5rem;
            background: rgba(255,255,255,0.2);
            padding: 1.5rem;
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .course-header-info h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .course-meta {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .course-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .course-progress-large {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-percent-large {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .progress-bar-large {
            height: 12px;
            background: var(--gray-light);
            border-radius: 6px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill-large {
            height: 100%;
            background: var(--gradient);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .course-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .lessons-section {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            padding: 1.2rem;
            border-bottom: 1px solid var(--gray-light);
            transition: all 0.3s;
            cursor: pointer;
            border-radius: 12px;
        }

        .lesson-item:hover {
            background: var(--gray-light);
            transform: translateX(5px);
        }

        .lesson-item.completed {
            opacity: 0.8;
        }

        .lesson-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
        }

        .lesson-info {
            flex: 1;
        }

        .lesson-title {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .lesson-duration {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .lesson-status {
            margin-left: 1rem;
            font-size: 1.2rem;
        }

        .current-lesson {
            background: rgba(139, 92, 246, 0.1);
            border-left: 4px solid var(--primary);
        }

        .current-lesson .lesson-title {
            color: var(--primary);
            font-weight: 700;
        }

        .course-sidebar {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .teacher-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--gray-light);
        }

        .teacher-avatar {
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .resources-list {
            list-style: none;
            margin: 1rem 0;
        }

        .resources-list li {
            padding: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            border-bottom: 1px dashed var(--gray-light);
        }

        .complete-lesson-btn {
            width: 100%;
            background: var(--gradient);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1.5rem;
        }

        .complete-lesson-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            text-decoration: none;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .course-content {
                grid-template-columns: 1fr;
            }
            
            .course-header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .course-meta {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="logo">
                <h2>LearnPro</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html">📊 Мой кабинет</a></li>
                <li><a href="courses.html">🎓 Все курсы</a></li>
                <li><a href="#" onclick="logout()">🚪 Выйти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Course View -->
    <section class="course-view">
        <div class="container">
            <a href="dashboard.html" class="back-btn">
                ← Вернуться в кабинет
            </a>

            <div id="courseContainer">
                <!-- Данные загружаются через JavaScript -->
            </div>
        </div>
    </section>

    <script src="course-view.js"></script>
</body>
</html>
